name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check worker.js
      - name: No secrets committed
        run: |
          if grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}|sk-or-v1-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}' worker.js README.md README.fa.md; then
            echo "Possible secret found"; exit 1
          fi
